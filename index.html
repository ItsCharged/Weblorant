<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>SHARDLINE</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background: #0d131a;
        color: #e8eef5;
        user-select: none;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #ui-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0f17;
        color: #f4f7fb;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        transition: opacity 0.28s ease;
      }
      #loading-screen.is-hiding {
        opacity: 0;
        pointer-events: none;
      }
      .loading-card {
        width: min(360px, 86vw);
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 28px 26px;
        background: #131a26;
        border-radius: 8px;
      }
      .loading-brand-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .loading-mark {
        width: 14px;
        height: 28px;
        background: #ff4655;
        border-radius: 2px;
        flex-shrink: 0;
      }
      .loading-title {
        font-size: 1.3rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        color: #f4f7fb;
      }
      .loading-track {
        width: 100%;
        height: 6px;
        background: #1d2738;
        border-radius: 3px;
        overflow: hidden;
      }
      .loading-fill {
        width: 12%;
        height: 100%;
        background: #ff4655;
        border-radius: 3px;
        transition: width 0.22s ease;
      }
      .loading-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #8b9bb0;
      }
      #loading-percent {
        color: #f4f7fb;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen" role="status" aria-live="polite" aria-label="Spiel wird geladen">
      <div class="loading-card">
        <div class="loading-brand-row">
          <span class="loading-mark" aria-hidden="true"></span>
          <span class="loading-title">SHARDLINE</span>
        </div>
        <div class="loading-track">
          <div class="loading-fill" id="loading-bar-fill"></div>
        </div>
        <div class="loading-meta">
          <span id="loading-status">ENGINE WIRD INITIALISIERT...</span>
          <span id="loading-percent">12%</span>
        </div>
      </div>
    </div>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
